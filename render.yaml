services:
  - type: web
    name: nutrition-tracker-api
    runtime: python
    rootDir: nutrition-api
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    plan: free
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1
      - key: OPENAI_API_BASE
        value: https://api.openai.com/v1
